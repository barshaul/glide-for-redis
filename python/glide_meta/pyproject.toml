[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "test-valkey-glide"
version = "0.1.2"
description = "Meta client for test-glide-meta, combining sync and async clients"

[project.optional-dependencies]
sync = ["test-valkey-glide-sync"]
async = ["test-valkey-glide-async"]
full = ["test-valkey-glide-async", "test-valkey-glide-sync"]
