[build-system]
requires = ["setuptools>=61.0", "wheel", "cffi>=1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "test-valkey-glide-sync"
version = "0.1.2"
description = "Valkey GLIDE Sync client (CFFI-based)"
requires-python = ">=3.9"
dependencies = [
    "cffi>=1.0.0",
    "protobuf>=6.20",
]

[tool.setuptools]
package-dir = {"" = "../../"}
include-package-data = true
packages = ["glide.sync", "glide", "glide.commands", "glide.commands.sync_commands", "glide.protobuf", "glide.commands.server_modules", "glide.commands.server_modules.ft_options"]

[tool.setuptools.package-data]
"glide.sync" = ["*.so", "*.pyd", "*.dll", "*.pyi", "py.typed"]
